# Alembic configuration. Run all `alembic` commands from `backend/`.

[alembic]
# Path to migration scripts (relative to this file).
script_location = alembic

# Template used to generate revision filenames.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Timezone for revision file_template timestamps.
timezone = UTC

# sqlalchemy.url is intentionally blank — env.py loads the URL from app.config
# (i.e. from the .env file). Do not hard-code it here.
sqlalchemy.url =

[post_write_hooks]
# (none for now)

# --- Logging ---
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
